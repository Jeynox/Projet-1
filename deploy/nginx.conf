# Exemple de server block Nginx + PHP-FPM pour The Wild Tour.
# À copier dans /etc/nginx/sites-available/ et adapter server_name, root et la version de PHP.

server {
    listen 80;
    server_name exemple.fr;
    root /var/www/the-wild-tour;
    index index.html index.php;

    server_tokens off;
    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # À activer une fois le certificat HTTPS en place (certbot --nginx) :
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Fichiers cachés (.git, .htaccess, .vscode...), includes PHP, config et docs
    location ~ /\.            { deny all; }
    location ^~ /includes/    { deny all; }
    location ^~ /deploy/      { deny all; }
    location ~* \.(md|log|bak|tmp|conf|ini|sql)$ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # Pas de add_header ici : il écraserait les en-têtes de sécurité du bloc server.
    location ~* \.(jpe?g|png|webp|avif|svg|ico)$ {
        expires 30d;
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 7d;
    }
}
