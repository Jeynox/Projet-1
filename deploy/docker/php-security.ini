; Durcissement PHP en production
expose_php = Off
display_errors = Off
log_errors = On
allow_url_fopen = Off
allow_url_include = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
post_max_size = 1M
upload_max_filesize = 1M
file_uploads = Off
max_execution_time = 10
memory_limit = 64M
