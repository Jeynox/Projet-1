# Durcissement Apache dans le conteneur
ServerTokens Prod
ServerSignature Off
TraceEnable Off
ServerName localhost

# Autorise le .htaccess du site (en-têtes, blocage des fichiers sensibles)
<Directory /var/www/html>
    Options -Indexes -FollowSymLinks +SymLinksIfOwnerMatch
    AllowOverride All
    Require all granted
</Directory>

# Caddy termine le HTTPS : on le signale à PHP (cookie de session Secure).
# Le conteneur n'écoute que sur 127.0.0.1, seul Caddy peut lui parler.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
